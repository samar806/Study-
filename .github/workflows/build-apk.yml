name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java version is $JAVA_VER, expected 17+"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore was not created"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
            echo "Verified APK exists at $APK_PATH"
          else
            echo "Error: $APK_PATH not found or is empty."
            echo "Searching app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        id: prep_asset
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${{ runner.temp }}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi
          echo "asset_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          BODY="Automated Debug APK Build

          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}

          *Note: This is an automatically generated debug build for testing only, signed with a temporary debug keystore, not for Google Play Store distribution.*"

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release created successfully!"
            gh release view "$TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

            echo "### 🚀 Debug APK Released Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "**Release Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "**Release Title:** Debug APK Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "**Asset Name:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "**Release Page:** [View Release]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*(Note: The Actions artifact \`app-debug-apk\` is also stored in this workflow run as a backup.)*" >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: GitHub Release publication was skipped or failed."
            echo "The build itself succeeded and the Actions artifact 'app-debug-apk' is available for download."
            echo "### ⚠️ Debug APK Artifact Ready (Release step outcome: ${{ steps.create_release.outcome }})" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK artifact **\`app-debug-apk\`** was uploaded successfully to this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
